[pytest]
# `site/` é pacote de topo próprio (import `app.*`); a raiz dá acesso a `src`/`tests`.
pythonpath = . site

markers =
    unit: Testes unitários rápidos e isolados (sem banco de dados nem I/O de rede)
    db: Testes de integração dependentes do PostgreSQL (scraper-cebraspe-db)
    pipeline: Testes do ecossistema de pipeline (crawler, parsers, taxonomia, árvore, writers)
    site: Testes da aplicação web e API (site/tests/)
    slow: Testes com tempo individual de execução elevado (> 3s)
