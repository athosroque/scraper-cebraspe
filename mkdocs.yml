site_name: "Scraper CEBRASPE — Documentação"

# docs_dir e site_dir fora do padrão de propósito: o padrão `site/` apagaria
# o app FastAPI que vive em `site/` a cada `mkdocs build`. O build vai para
# `build/docs/` (ignorado pelo git) e é servido pelo nginx do docker-compose.
docs_dir: docs
site_dir: build/docs

not_in_nav: |
  guia/_contrato.md

theme:
  name: material
  language: pt-BR
  # Fonte do sistema em vez da Roboto do Google Fonts: o Mermaid mede o rótulo
  # antes da fonte web carregar, e o texto saía do quadro. Visual em
  # `docs/stylesheets/tema.css` (paleta neutra, no estilo da documentação do Orca).
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/tema.css
  - stylesheets/impressao.css

plugins:
  - search:
      lang: pt

markdown_extensions:
  - toc:
      permalink: true
      # Âncora com acento no GitHub: `#atualização--adr-020-2026-09-21`
      # (ADR-018). O slugify padrão do MkDocs remove o acento e quebra o link.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Com `mkdocs build --strict` (usado pelo `make docs-build` e pelo `make check`),
# uma página fora do nav, um link quebrado ou uma âncora inexistente viram erro.
# Isso é a guarda: um ADR novo sem entrada no nav quebra o check.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Início: index.md
  - Visão executiva:
      - executivo/index.md
      - Arquitetura: executivo/arquitetura.md
      - Números: executivo/numeros.md
      - Decisões principais: executivo/decisoes.md
      - Roadmap: executivo/roadmap.md
  - Guia técnico:
      - guia/index.md
      - Começando: guia/comecando.md
      - Glossário: guia/glossario.md
      - Para agentes:
