<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Questões CEBRASPE{% endblock %}</title>
    <meta name="description" content="{% block description %}Questões de concursos do CEBRASPE para resolver, filtradas por matéria, assunto e subassunto.{% endblock %}">
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/site.css">
    <script src="/static/htmx.min.js"></script>
    <script defer src="/static/alpine.min.js"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token(request) }}"}'>
    <header class="container">
        <nav>
            <ul>
                <li><strong><a href="/" class="contrast">Questões CEBRASPE</a></strong></li>
            </ul>
            <ul>
                <li><a href="/sobre">Sobre</a></li>
                {% if request.session.get("usuario_id") %}
                <li><a href="/conta">{{ request.session.get("usuario_nome") }}</a></li>
                <li>
                    <form method="post" action="/sair" style="margin: 0;">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
                        <button type="submit" class="outline secondary" style="padding: 0.2rem 0.6rem; margin: 0;">Sair</button>
                    </form>
                </li>
                {% elif login_habilitado() %}
                <li><a href="/entrar?voltar={{ request.url.path|urlencode }}" role="button" class="outline" style="padding: 0.2rem 0.6rem;">Entrar com Google</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
