{% if questao.texto_base_texto %}
<div class="mb-3 whitespace-pre-wrap text-sm leading-relaxed text-slate-800">{{ questao.texto_base_texto }}</div>
{% endif %}
{% for fig in questao.figuras %}
{% if fig.url %}
<img src="{{ fig.url }}" alt="Figura da questão {{ questao.numero }}" loading="lazy" class="mb-2 block h-auto max-w-full rounded border border-slate-200">
{% endif %}
{% endfor %}
